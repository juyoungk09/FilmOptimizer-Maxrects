server {
    # IPv4 만 열면 컨테이너 안에서 localhost 가 ::1 로 잡힐 때 연결이 거부된다.
    # IPv6 으로 해석되는 호스트네임을 거치는 배포도 있으므로 둘 다 연다.
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx 기본값은 1MB 라서 조각이 많은 요청이 413 으로 잘린다.
    # 조각 DTO 하나가 약 40바이트라 1MB 는 대략 2만 7천 조각이지만,
    # 미리 명시해 두는 편이 낫다. Cloudflare Tunnel 의 한계(무료 100MB)보다
    # 충분히 작게 둔다.
    client_max_body_size 10m;

    # 413 을 HTML 대신 JSON 으로 돌려준다. 프론트가 response.data.message 를
    # 그대로 사이드바에 보여주기 때문이다.
    error_page 413 = @payload_too_large;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"message":"요청 크기가 10MB 를 넘었습니다. 조각이 너무 많습니다."}';
    }

    # SPA 는 라우팅이 전부 클라이언트라 index.html 로 떨어져야 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 는 파일명에 내용 해시를 넣는다. 내용이 바뀌면 이름도 바뀌므로
    # 오래 이 캐시를 써도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 만은 절대 오래 캐시하지 않는다.
    # 여기서 캐시하면 배포 후에도 브라우저가 예전 빌드를 계속 보게 된다.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 같은 오리진으로 프록시한다. 그래서 브라우저 요청에 CORS 가 붙지 않고
    # 프론트 코드에 백엔드 주소(localhost:5042 등)를 넣을 필요가 없다.
    # 슬래시 없는 proxy_pass 라서 /api/optimize 가 그대로 /api/optimize 로 전달된다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
